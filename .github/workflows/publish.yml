name: Publish

# One run can release any combination of packages. Each package gets its own
# bump type, and versions are always computed from what is currently on npm
# rather than from the checked-in package.json, so a stale or hand-edited
# version can never produce a conflicting or skipped release.

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Bump for @typed-firestore/server"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      react:
        description: "Bump for @typed-firestore/react"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      react_native:
        description: "Bump for @typed-firestore/react-native"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      rest:
        description: "Bump for @typed-firestore/rest"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: "Prerelease identifier (alpha, beta, rc). Only used with pre* bumps."
        required: false
        type: string
      dry_run:
        description: "Dry run — resolve versions only, skip commit, publish, push, and release"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    # Authentication is handled via OIDC trusted publishing (id-token),
    # so no NPM_TOKEN secret is needed. Every package name needs its own
    # trusted publisher configured on npmjs.com pointing at this workflow,
    # otherwise the registry rejects the publish with a misleading 404.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Resolves every selected package to a concrete version and writes it
      # into its package.json. The base version comes from the registry, so a
      # re-run after a partially failed release automatically computes the
      # right versions for whatever did not get published.
      - name: Resolve versions
        id: resolve
        env:
          BUMP_SERVER: ${{ inputs.server }}
          BUMP_REACT: ${{ inputs.react }}
          BUMP_REACT_NATIVE: ${{ inputs.react_native }}
          BUMP_REST: ${{ inputs.rest }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail

          RELEASES="[]"

          for entry in \
            "server:$BUMP_SERVER" \
            "react:$BUMP_REACT" \
            "react-native:$BUMP_REACT_NATIVE" \
            "rest:$BUMP_REST"
          do
            DIR="${entry%%:*}"
            BUMP="${entry#*:}"

            if [[ "$BUMP" == "skip" ]]; then
              continue
            fi

            MANIFEST="packages/${DIR}/package.json"
            NAME=$(node -p "require('./${MANIFEST}').name")

            if BASE=$(npm view "$NAME" version 2>/dev/null); then
              # Bump from the published version rather than the checked-in one,
              # using npm's own semver implementation.
              (
                cd "packages/${DIR}"
                npm pkg set "version=${BASE}"

                ARGS=("$BUMP")
                if [[ "$BUMP" == pre* && -n "$PREID" ]]; then
                  ARGS+=(--preid "$PREID")
                fi

                npm version "${ARGS[@]}" --git-tag-version false > /dev/null
              )
            else
              # Distinguish a genuine "not published yet" from a network or
              # registry failure, which must not be treated as a first publish.
              if ! npm view "$NAME" version 2>&1 | grep -q "E404"; then
                echo "::error::Failed to query npm for ${NAME}"
                exit 1
              fi

              echo "::notice title=First publish::${NAME} is not on npm yet, publishing the version in package.json as-is and ignoring the requested ${BUMP} bump"
            fi

            VERSION=$(node -p "require('./${MANIFEST}').version")

            if [[ "$VERSION" == *-* ]]; then
              DIST_TAG="next"
              PRERELEASE="true"
            else
              DIST_TAG="latest"
              PRERELEASE="false"
            fi

            RELEASES=$(jq -c \
              --arg dir "$DIR" \
              --arg name "$NAME" \
              --arg version "$VERSION" \
              --arg tag "${NAME}@${VERSION}" \
              --arg dist_tag "$DIST_TAG" \
              --argjson prerelease "$PRERELEASE" \
              '. + [{dir: $dir, name: $name, version: $version, tag: $tag, dist_tag: $dist_tag, prerelease: $prerelease}]' \
              <<< "$RELEASES")
          done

          if [[ "$RELEASES" == "[]" ]]; then
            echo "::error::No packages selected. Set at least one package to something other than skip."
            exit 1
          fi

          echo "releases=${RELEASES}" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          {
            echo "### Publish Summary"
            echo ""
            echo "- **Dry run:** ${{ inputs.dry_run }}"
            echo ""
            echo "| Package | Version | Tag | Dist tag |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| \(.name) | \(.version) | \(.tag) | \(.dist_tag) |"' <<< "$RELEASES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version bumps
        if: ${{ !inputs.dry_run }}
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          git add packages/*/package.json

          # A single-package release keeps the historical commit message
          # convention of using the tag verbatim.
          if [[ $(jq length <<< "$RELEASES") -eq 1 ]]; then
            MESSAGE=$(jq -r '.[0].tag' <<< "$RELEASES")
          else
            MESSAGE="Release $(jq -r '[.[].tag] | join(", ")' <<< "$RELEASES")"
          fi

          git commit -m "$MESSAGE"

          for TAG in $(jq -r '.[].tag' <<< "$RELEASES"); do
            git tag -a "$TAG" -m "$TAG"
          done

      # Publish before push: npm publish is not retryable (same version
      # can't be published twice), while git push is idempotent. If push
      # fails after a successful publish, it can simply be retried manually.
      # If one package fails partway through, nothing is pushed and re-running
      # with only the unpublished packages selected resolves the same versions.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          COUNT=$(jq length <<< "$RELEASES")

          for INDEX in $(seq 0 $((COUNT - 1))); do
            DIR=$(jq -r ".[${INDEX}].dir" <<< "$RELEASES")
            TAG=$(jq -r ".[${INDEX}].tag" <<< "$RELEASES")
            DIST_TAG=$(jq -r ".[${INDEX}].dist_tag" <<< "$RELEASES")

            echo "Publishing ${TAG} with dist tag ${DIST_TAG}"

            (
              cd "packages/${DIR}"
              npm publish --provenance --tag "$DIST_TAG"
            )
          done

      - name: Push commit and tags
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD --follow-tags

      - name: Create GitHub Releases
        if: ${{ !inputs.dry_run }}
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          COUNT=$(jq length <<< "$RELEASES")

          for INDEX in $(seq 0 $((COUNT - 1))); do
            TAG=$(jq -r ".[${INDEX}].tag" <<< "$RELEASES")
            PRERELEASE=$(jq -r ".[${INDEX}].prerelease" <<< "$RELEASES")

            PRERELEASE_FLAG=""
            if [[ "$PRERELEASE" == "true" ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "$TAG" --generate-notes $PRERELEASE_FLAG
          done
