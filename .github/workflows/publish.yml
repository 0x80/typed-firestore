name: Publish

# One run can release any combination of packages. Each package gets its own
# bump type, and versions are always computed from what is currently on npm
# rather than from the checked-in package.json, so a stale or hand-edited
# version can never produce a conflicting or skipped release.

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Bump for @typed-firestore/server"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      react:
        description: "Bump for @typed-firestore/react"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      react_native:
        description: "Bump for @typed-firestore/react-native"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      rest:
        description: "Bump for @typed-firestore/rest"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: "Prerelease identifier (alpha, beta, rc). Only used with pre* bumps."
        required: false
        type: string
      dry_run:
        description: "Dry run — resolve versions only, skip commit, publish, push, and release"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    # Authentication is handled via OIDC trusted publishing (id-token),
    # so no NPM_TOKEN secret is needed. Every package name needs its own
    # trusted publisher configured on npmjs.com pointing at this workflow,
    # otherwise the registry rejects the publish with a misleading 404.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # The concurrency group serializes runs but does not refresh the
      # checkout of one that queued behind another, so a waiting run can hold
      # a commit that is no longer main's tip and would publish stale source
      # before failing its push. Fail here instead, where nothing is spent.
      - name: Verify the checkout is main's tip
        run: |
          set -euo pipefail

          git fetch origin main --quiet
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse FETCH_HEAD)

          if [[ "$LOCAL" != "$REMOTE" ]]; then
            echo "::error::This run checked out ${LOCAL} but main is now ${REMOTE}. Re-run the workflow to release from main's tip."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Resolves every selected package to a concrete version and writes it
      # into its package.json. The base version comes from the registry, so a
      # re-run after a partially failed release automatically computes the
      # right versions for whatever did not get published.
      - name: Resolve versions
        id: resolve
        env:
          BUMPS: ${{ toJSON(inputs) }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail

          RELEASES="[]"

          # The packages come from the workspace rather than a list kept in
          # step with the inputs. A new package still needs its own input,
          # since workflow_dispatch has no multi-select, but forgetting one
          # now warns instead of silently dropping the package.
          for MANIFEST in packages/*/package.json; do
            DIR=$(basename "$(dirname "$MANIFEST")")

            # Input names cannot contain dashes.
            KEY="${DIR//-/_}"

            if ! jq -e --arg key "$KEY" 'has($key)' <<< "$BUMPS" > /dev/null; then
              echo "::warning::packages/${DIR} has no matching workflow input and cannot be released. Add a ${KEY} input to this workflow."
              continue
            fi

            BUMP=$(jq -r --arg key "$KEY" '.[$key]' <<< "$BUMPS")

            if [[ "$BUMP" == "skip" ]]; then
              continue
            fi

            # Guards against a package directory whose name collides with an
            # input that isn't a bump, such as preid.
            case "$BUMP" in
              patch | minor | major | prepatch | preminor | premajor | prerelease) ;;
              *)
                echo "::error::packages/${DIR} resolved to the invalid bump '${BUMP}'. Its name likely collides with a non-bump workflow input."
                exit 1
                ;;
            esac

            # Without an identifier npm produces its numeric prerelease form
            # (1.2.4-0) rather than the documented alpha / beta / rc.
            if [[ "$BUMP" == pre* && -z "$PREID" ]]; then
              echo "::error::A ${BUMP} bump requires a prerelease identifier in the preid input (alpha, beta, rc)."
              exit 1
            fi

            # Read through jq rather than interpolating the globbed path into
            # JavaScript source, which a crafted directory name could escape.
            NAME=$(jq -r '.name' "$MANIFEST")

            # Read the whole package document in one query. Checking existence
            # this way separates "never published" from a package whose dist
            # tags are unusable, which a version lookup alone conflates.
            if PACKUMENT=$(npm view "$NAME" --json 2> /tmp/npm-view-error); then
              LATEST=$(jq -r '.["dist-tags"].latest // empty' <<< "$PACKUMENT")
              NEXT=$(jq -r '.["dist-tags"].next // empty' <<< "$PACKUMENT")

              # A version lookup follows the latest tag, which is the stable
              # line. Prerelease bumps have to continue the next line when it
              # is ahead, otherwise every pre* run after the first recomputes
              # a version that is already published. Next can also lag behind
              # latest once a prerelease is finalized, so compare rather than
              # preferring one outright.
              BASE="$LATEST"
              if [[ "$BUMP" == pre* && -n "$NEXT" ]]; then
                BASE=$(node -e '
                  const semver = require("semver");
                  const [latest, next] = process.argv.slice(1);
                  process.stdout.write(!latest || semver.gt(next, latest) ? next : latest);
                ' "$LATEST" "$NEXT")
              fi

              if [[ -z "$BASE" ]]; then
                echo "::error::${NAME} is published but has no usable latest or next dist tag to bump from."
                exit 1
              fi

              # Bump from the published version rather than the checked-in one,
              # using npm's own semver implementation.
              (
                cd "packages/${DIR}"
                npm pkg set "version=${BASE}"

                ARGS=("$BUMP" --preid "$PREID")
                if [[ "$BUMP" != pre* ]]; then
                  ARGS=("$BUMP")
                fi

                npm version "${ARGS[@]}" --git-tag-version false > /dev/null
              )
            else
              # Distinguish a genuine "not published yet" from a network or
              # registry failure, which must not be treated as a first publish.
              if ! grep -q "E404" /tmp/npm-view-error; then
                echo "::error::Failed to query npm for ${NAME}"
                cat /tmp/npm-view-error
                exit 1
              fi

              echo "::notice title=First publish::${NAME} is not on npm yet, publishing the version in package.json as-is and ignoring the requested ${BUMP} bump"
            fi

            VERSION=$(jq -r '.version' "$MANIFEST")

            if [[ "$VERSION" == *-* ]]; then
              DIST_TAG="next"
              PRERELEASE="true"
            else
              DIST_TAG="latest"
              PRERELEASE="false"
            fi

            RELEASES=$(jq -c \
              --arg dir "$DIR" \
              --arg name "$NAME" \
              --arg version "$VERSION" \
              --arg tag "${NAME}@${VERSION}" \
              --arg dist_tag "$DIST_TAG" \
              --argjson prerelease "$PRERELEASE" \
              '. + [{dir: $dir, name: $name, version: $version, tag: $tag, dist_tag: $dist_tag, prerelease: $prerelease}]' \
              <<< "$RELEASES")
          done

          if [[ "$RELEASES" == "[]" ]]; then
            echo "::error::No packages selected. Set at least one package to something other than skip."
            exit 1
          fi

          echo "releases=${RELEASES}" >> "$GITHUB_OUTPUT"

      # Runs before anything irreversible. A tag that already exists would
      # otherwise only surface at the push, by which point the version is
      # published and the release has no way to record itself.
      - name: Check tag availability
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          git fetch origin --tags --quiet

          for TAG in $(jq -r '.[].tag' <<< "$RELEASES"); do
            if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
              echo "::error::Tag ${TAG} already exists locally."
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists on origin."
              exit 1
            fi
          done

      - name: Publish summary
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          {
            echo "### Publish Summary"
            echo ""
            echo "- **Dry run:** ${{ inputs.dry_run }}"
            echo ""
            echo "| Package | Version | Tag | Dist tag |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | "| \(.name) | \(.version) | \(.tag) | \(.dist_tag) |"' <<< "$RELEASES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version bumps
        if: ${{ !inputs.dry_run }}
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          git add packages/*/package.json

          # A run that only publishes a never-published package leaves the
          # manifests untouched, and committing nothing is an error rather
          # than a no-op, which would abort the release before it publishes.
          if git diff --cached --quiet; then
            echo "No version changes to commit; the resolved versions already match the manifests."
            exit 0
          fi

          # A single-package release keeps the historical commit message
          # convention of using the tag verbatim.
          if [[ $(jq length <<< "$RELEASES") -eq 1 ]]; then
            MESSAGE=$(jq -r '.[0].tag' <<< "$RELEASES")
          else
            MESSAGE="Release $(jq -r '[.[].tag] | join(", ")' <<< "$RELEASES")"
          fi

          git commit -m "$MESSAGE"

      # Publish before push: npm publish is not retryable (the same version
      # can't be published twice), while pushing and tagging can be repeated
      # or redone by hand. Re-running with only the unpublished packages
      # selected resolves the same versions for them, because the base comes
      # from the registry, which never saw the versions that failed.
      #
      # Publish failures are collected rather than raised, so that whatever
      # did publish still gets its commit, tags and releases in the steps
      # below. The job is failed at the end, once the record exists. Strict
      # mode stays on: only npm publish is allowed to fail, because it is
      # guarded by the if, and everything else here must still be fatal.
      - name: Publish to npm
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          RELEASES: ${{ steps.resolve.outputs.releases }}
        run: |
          set -euo pipefail

          PUBLISHED="[]"
          FAILED=""
          COUNT=$(jq length <<< "$RELEASES")

          for INDEX in $(seq 0 $((COUNT - 1))); do
            ENTRY=$(jq -c ".[${INDEX}]" <<< "$RELEASES")
            DIR=$(jq -r '.dir' <<< "$ENTRY")
            NAME=$(jq -r '.name' <<< "$ENTRY")
            VERSION=$(jq -r '.version' <<< "$ENTRY")
            TAG=$(jq -r '.tag' <<< "$ENTRY")
            DIST_TAG=$(jq -r '.dist_tag' <<< "$ENTRY")

            echo "Publishing ${TAG} with dist tag ${DIST_TAG}"

            if ( cd "packages/${DIR}" && npm publish --provenance --tag "$DIST_TAG" ); then
              PUBLISHED=$(jq -c --argjson entry "$ENTRY" '. + [$entry]' <<< "$PUBLISHED")
              continue
            fi

            # A publish can fail after the registry has accepted the version,
            # so ask the registry rather than trusting the exit code. Treating
            # an accepted version as failed would leave it untagged and make
            # the re-run publish a redundant version on top of it.
            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "::notice title=Already published::${TAG} reported a failure but is on the registry, treating it as published."
              PUBLISHED=$(jq -c --argjson entry "$ENTRY" '. + [$entry]' <<< "$PUBLISHED")
              continue
            fi

            echo "::error::Publishing ${TAG} failed."
            FAILED="$TAG"
            break
          done

          {
            echo "published<<PUBLISHED_EOF"
            echo "$PUBLISHED"
            echo "PUBLISHED_EOF"
            echo "failed<<FAILED_EOF"
            echo "$FAILED"
            echo "FAILED_EOF"
          } >> "$GITHUB_OUTPUT"

      # Main moving during a run is the realistic push failure, and it is
      # recoverable: rebase onto it and try again. Anything that survives
      # three attempts needs hands, and by then the packages are published.
      - name: Push commit
        if: ${{ !inputs.dry_run && steps.publish.outputs.published != '[]' }}
        run: |
          set -euo pipefail

          for ATTEMPT in 1 2 3; do
            if git push origin HEAD; then
              exit 0
            fi

            echo "Push attempt ${ATTEMPT} failed, rebasing onto origin/main"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main conflicts. The packages are published and still get their tags and releases; re-create the version commit by hand."
              exit 1
            fi
          done

          echo "::error::Could not push after 3 attempts. The packages are published and still get their tags and releases; re-create the version commit by hand."
          exit 1

      # Tagged after the branch settles rather than alongside the commit, so
      # a rebase during the push can't leave the tags pointing at a commit
      # that is no longer on the branch.
      # always(), because a failed push must not leave published packages
      # without their tags — the tags push to their own refs and succeed even
      # when the branch push could not.
      - name: Create and push tags
        if: ${{ always() && !inputs.dry_run && steps.publish.outputs.published != '' && steps.publish.outputs.published != '[]' }}
        env:
          RELEASES: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail

          for TAG in $(jq -r '.[].tag' <<< "$RELEASES"); do
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/${TAG}"
          done

      - name: Create GitHub Releases
        if: ${{ always() && !inputs.dry_run && steps.publish.outputs.published != '' && steps.publish.outputs.published != '[]' }}
        env:
          RELEASES: ${{ steps.publish.outputs.published }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          COUNT=$(jq length <<< "$RELEASES")

          for INDEX in $(seq 0 $((COUNT - 1))); do
            TAG=$(jq -r ".[${INDEX}].tag" <<< "$RELEASES")
            PRERELEASE=$(jq -r ".[${INDEX}].prerelease" <<< "$RELEASES")

            # Idempotent so a re-run after a partial failure fills in only
            # the releases that are missing.
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release ${TAG} already exists, skipping"
              continue
            fi

            PRERELEASE_FLAG=""
            if [[ "$PRERELEASE" == "true" ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "$TAG" --generate-notes $PRERELEASE_FLAG
          done

      # Runs last so that everything published before the failure has been
      # committed, tagged and released first. Re-running with the remaining
      # packages selected resolves their versions from the registry, which is
      # unchanged for anything that did not publish.
      - name: Report a partial release
        if: ${{ always() && !inputs.dry_run && steps.publish.outputs.failed != '' }}
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          FAILED: ${{ steps.publish.outputs.failed }}
        run: |
          set -euo pipefail

          {
            echo ""
            echo "### Partial release"
            echo ""
            echo "Publishing \`${FAILED}\` failed."
            echo ""

            if [[ "$PUBLISHED" == "[]" ]]; then
              echo "Nothing was published, so no commit, tag or release was created."
            else
              echo "These packages published and have been committed, tagged and released:"
              echo ""
              jq -r '.[] | "- \(.tag)"' <<< "$PUBLISHED"
              echo ""
              echo "Re-run with only the remaining packages selected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
